---
include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/recipes/debian.yml

variables:
  # 1. Enable standard tests that are OFF by default
  SALSA_CI_ENABLE_REPROTEST: 1
  SALSA_CI_ENABLE_LICENSERECON: 1
  SALSA_CI_ENABLE_WRAP_AND_SORT: 1
  SALSA_CI_ENABLE_MISSING_BREAKS: 1
  SALSA_CI_ENABLE_RC_BUGS: 1
  
  # 2. Enable extra Build variants
  SALSA_CI_ENABLE_BUILD_PACKAGE_ANY: 1
  SALSA_CI_ENABLE_BUILD_PACKAGE_ALL: 1
  SALSA_CI_ENABLE_VALIDATE_PACKAGE_CLEAN_UP: 1
  SALSA_CI_DISABLE_BUILD_PACKAGE_I386: 0
  
  # 3. Enable Architecture-specific tests (Requires available runners)
  # arm64, armel, armhf jobs are enabled here:
  SALSA_CI_DISABLE_BUILD_PACKAGE_ARM64: 0
  SALSA_CI_DISABLE_AUTOPKGTEST_ARM64: 0
  
  # 4. Enable specialized test features
  SALSA_CI_REPROTEST_ENABLE_DIFFOSCOPE: 1
  SALSA_CI_LINTIAN_FAIL_WARNING: 1  # Make Lintian stricter
  SALSA_CI_DISABLE_APTLY: 0          # Generates a temporary APT repo
  
